# Default: NVIDIA GPU. Needs the NVIDIA Container Toolkit on the Docker host.
# No GPU? Add the CPU override:
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
# GB_STATE_DIR (default: this folder) is where videos/, outputs/, data/ and weights/ live.
# Set it in .env to reuse an existing checkout's folders. GB_PORT changes the host port.
# GB_MAX_JOBS caps how many analyses run at once (unset: sized from the host's CPU, RAM
# and GPU count, 2 on one GPU); further jobs wait in a queue.
services:
  app:
    # No build: section on purpose. The image is built from main only, never from this
    # checkout: python scripts/docker_build.py [--cpu]
    image: kestrel:gpu
    container_name: kestrel
    ports:
      - "${GB_PORT:-5050}:5050"
    volumes:
      - ${GB_STATE_DIR:-.}/videos:/app/videos
      - ${GB_STATE_DIR:-.}/outputs:/app/outputs
      - ${GB_STATE_DIR:-.}/data:/app/data
      - ${GB_STATE_DIR:-.}/weights:/app/weights
      - model-cache:/root/.cache   # RTMPose / ultralytics auto-downloads
    environment:
      - GB_MAX_JOBS=${GB_MAX_JOBS:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # One-shot helper: docker compose --profile tools run --rm fetch-weights
  fetch-weights:
    profiles: ["tools"]
    image: curlimages/curl:8.10.1
    user: root
    working_dir: /weights
    volumes:
      - ${GB_STATE_DIR:-.}/weights:/weights
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        base=https://github.com/yo-WASSUP/Good-Badminton/releases/latest/download
        for f in yolo11s-ball.pt yolox_nano_8xb8-300e_humanart-40f6f0d0.onnx; do
          if [ -s "$$f" ]; then echo "have $$f"; else echo "fetching $$f"; curl -fL -o "$$f" "$$base/$$f"; fi
        done

volumes:
  model-cache:
