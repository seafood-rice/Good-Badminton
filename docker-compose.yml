# Default: NVIDIA GPU. Needs the NVIDIA Container Toolkit on the Docker host.
# No GPU? Add the CPU override:
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up --build
services:
  app:
    build:
      context: .
      args:
        ACCEL: gpu
        BASE_IMAGE: nvidia/cuda:12.6.3-cudnn-runtime-ubuntu24.04
    image: good-badminton:gpu
    container_name: good-badminton
    ports:
      - "${GB_PORT:-5050}:5050"
    volumes:
      - ./videos:/app/videos
      - ./outputs:/app/outputs
      - ./data:/app/data
      - ./weights:/app/weights
      - model-cache:/root/.cache   # RTMPose / ultralytics auto-downloads
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # One-shot helper: docker compose --profile tools run --rm fetch-weights
  fetch-weights:
    profiles: ["tools"]
    image: curlimages/curl:8.10.1
    user: root
    working_dir: /weights
    volumes:
      - ./weights:/weights
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        base=https://github.com/yo-WASSUP/Good-Badminton/releases/latest/download
        for f in yolo11s-ball.pt yolox_nano_8xb8-300e_humanart-40f6f0d0.onnx; do
          if [ -s "$$f" ]; then echo "have $$f"; else echo "fetching $$f"; curl -fL -o "$$f" "$$base/$$f"; fi
        done

volumes:
  model-cache:
